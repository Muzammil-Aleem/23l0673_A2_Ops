# VisionGuard stack (Task 6.3): `docker compose up -d --build`
# Two services on Compose's default internal network. The web app reaches the
# database by its SERVICE NAME ("db"), Compose's built-in DNS resolves it.
name: ${COMPOSE_PROJECT_NAME:-23l0673_a2_ops}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # from the untracked .env
    volumes:
      - pgdata:/var/lib/postgresql/data          # named volume: history survives `down`/rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # NO `ports:` section on purpose — Postgres is reachable only from inside the network

  web:
    build:
      context: .
      args:
        WITH_TF: ${WITH_TF:-true}
    image: visionguard-web:latest
    depends_on:
      db:
        condition: service_healthy               # wait until pg_isready succeeds
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      MODEL_PATH: /app/models/champion.keras
      MODEL_META: /app/models/champion.json
      THRESHOLD: ${THRESHOLD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      - ./models:/app/models:ro                  # champion model mounted, read-only
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
